version: "3.9"

services:
  db:
    image: postgres:15
    container_name: deepmind-db
    restart: always
    environment:
      POSTGRES_DB: deepmind
      POSTGRES_USER: deepmind_user
      POSTGRES_PASSWORD: deepmind_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - deepmind-network

  backend:
    build: ./backend
    container_name: deepmind-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - deepmind-network
    command: bash -c "python manage.py makemigrations accounts assessments && python manage.py migrate && python manage.py runserver 0.0.0.0:8080"


  frontend:
    build: ./frontend
    container_name: deepmind-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    networks:
      - deepmind-network

  nginx:
    image: nginx:latest
    container_name: deepmind-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - deepmind-network

volumes:
  pgdata:

networks:
  deepmind-network:
    driver: bridge
